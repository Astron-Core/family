<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060912">
<title>แผนผังเครือญาติ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060912; --bg2:#0b1222; --glass:rgba(18,26,46,.62); --glass-2:rgba(26,36,62,.7);
  --stroke:rgba(140,170,255,.16); --stroke-2:rgba(140,170,255,.32);
  --ink:#e8eeff; --muted:#8b97b8; --dim:#5a6585;
  --node:#0f1730;
  --g1:#fbbf24; --g2:#22d3ee; --g3:#a78bfa; --g4:#f472b6;  --accent:#22d3ee; --accent-2:#a78bfa;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:
    radial-gradient(1200px 600px at 10% -10%, rgba(34,211,238,.12), transparent 60%),
    radial-gradient(900px 600px at 100% 0%, rgba(167,139,250,.14), transparent 60%),
    radial-gradient(800px 500px at 50% 110%, rgba(244,114,182,.08), transparent 60%),
    var(--bg);
  color:var(--ink);font-family:"IBM Plex Sans Thai",system-ui,sans-serif;font-size:15px;line-height:1.5;min-height:100vh;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(140,170,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(140,170,255,.05) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse at 50% 30%,#000 30%,transparent 80%);
}
.wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:28px 16px 48px}

/* header */
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:22px}
.eyebrow{font-family:Kanit;font-weight:300;letter-spacing:.32em;font-size:12px;color:var(--accent);text-transform:uppercase}
h1{font-family:Kanit;font-weight:600;font-size:clamp(30px,5vw,46px);line-height:1.15;margin:4px 0 0;
  background:linear-gradient(90deg,#e8eeff 0%,#9be7f5 45%,#c4b5fd 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--glass);border:1px solid var(--stroke);border-radius:14px;padding:8px 14px;min-width:86px;backdrop-filter:blur(10px)}
.stat b{display:block;font-family:Kanit;font-weight:500;font-size:22px;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}

/* toolbar */
.toolbar{position:sticky;top:10px;z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  background:var(--glass);border:1px solid var(--stroke);border-radius:16px;padding:8px;margin-bottom:18px;backdrop-filter:blur(14px)}
.seg{display:flex;gap:4px;background:rgba(0,0,0,.25);border-radius:12px;padding:4px}
.seg button{font:inherit;font-size:14px;color:var(--muted);background:transparent;border:0;border-radius:9px;padding:7px 14px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:.2s}
.seg button:hover{color:var(--ink)}
.seg button.on{color:#04121a;background:linear-gradient(135deg,var(--accent),#7dd3fc);box-shadow:0 0 18px rgba(34,211,238,.35)}
.seg svg{width:16px;height:16px}
.search{display:flex;align-items:center;gap:8px;flex:1;min-width:200px;max-width:380px;background:rgba(0,0,0,.25);border:1px solid var(--stroke);border-radius:12px;padding:0 12px}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(34,211,238,.15)}
.search input{flex:1;font:inherit;font-size:14px;color:var(--ink);background:transparent;border:0;outline:0;padding:8px 0;min-width:0}
.search input::placeholder{color:var(--dim)}
.search .count{font-size:12px;color:var(--accent);white-space:nowrap}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding:0 6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;box-shadow:0 0 8px currentColor}

.view{display:none}
.view.on{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* chips */
.g1{--c:var(--g1)} .g2{--c:var(--g2)} .g3{--c:var(--g3)} .g4{--c:var(--g4)}.unit{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:4px 10px 4px 10px;border-radius:10px;
  background:linear-gradient(90deg,color-mix(in srgb,var(--c) 14%,transparent),rgba(255,255,255,.02));
  border:1px solid color-mix(in srgb,var(--c) 30%,transparent);border-left:3px solid var(--c);font-size:14px;white-space:nowrap;transition:.2s}
.chip b{font-weight:500}
.chip .nick{font-size:11.5px;font-weight:600;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);border-radius:999px;padding:0 8px;line-height:1.6}
.chip.hit{box-shadow:0 0 0 1px var(--c),0 0 18px color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 26%,transparent)}
.ring{color:var(--dim);font-size:13px}

/* cards view */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,540px),1fr));gap:16px}
.branch{position:relative;background:var(--glass);border:1px solid var(--stroke);border-radius:18px;padding:16px 16px 12px;backdrop-filter:blur(10px);overflow:hidden;transition:.25s}
.branch::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),var(--accent-2),transparent);opacity:.7}
.branch:hover{border-color:var(--stroke-2)}
.branch.dim{opacity:.25}
.branch{scroll-margin-top:var(--bbar-off,150px)}
.branch.focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 32px rgba(34,211,238,.28)}
.grid.focusing .branch:not(.focus){opacity:.3}
.bbar{position:sticky;top:84px;z-index:4;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:8px;margin-bottom:16px;
  background:var(--glass);border:1px solid var(--stroke);border-radius:14px;backdrop-filter:blur(14px)}
.bbar::-webkit-scrollbar{display:none}
@media (min-width:601px){.bbar{flex-wrap:wrap;overflow:visible}}
.bbar button{flex:0 0 auto;font:inherit;font-size:13.5px;color:var(--muted);background:rgba(255,255,255,.03);border:1px solid var(--stroke);border-radius:10px;padding:6px 12px;cursor:pointer;white-space:nowrap;display:flex;gap:8px;align-items:center;transition:.2s}
.bbar button b{font-family:Kanit;font-weight:500;color:var(--g1)}
.bbar button:hover{color:var(--ink);border-color:var(--stroke-2)}
.bbar button.on{color:#1a1204;background:linear-gradient(135deg,var(--g1),#fde68a);border-color:transparent;box-shadow:0 0 16px rgba(251,191,36,.35)}
.bbar button.on b{color:#1a1204}
.branch-no{display:flex;align-items:center;gap:8px;font-family:Kanit;font-weight:300;font-size:12px;letter-spacing:.2em;color:var(--muted);margin-bottom:8px;
  width:100%;background:none;border:0;padding:0;text-align:left;cursor:default;-webkit-tap-highlight-color:transparent}
.branch-no b{font-weight:500;color:var(--accent);font-size:14px;letter-spacing:.05em}
.branch-no .bsum,.branch-no .bcnt,.branch-no .chev{display:none}
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{padding-left:26px;position:relative}
.tree li{position:relative;padding:4px 0}
.tree ul>li::before{content:"";position:absolute;left:-15px;top:0;bottom:0;border-left:1.5px solid var(--stroke-2)}
.tree ul>li:last-child::before{bottom:auto;height:21px}
.tree ul>li::after{content:"";position:absolute;left:-15px;top:21px;width:12px;border-top:1.5px solid var(--stroke-2)}

/* tree overview */
.stage{position:relative;height:min(78vh,900px);background:rgba(4,8,18,.6);border:1px solid var(--stroke);border-radius:18px;overflow:hidden}
.stage svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.stage svg.drag{cursor:grabbing}
.stage text{font-family:"IBM Plex Sans Thai",sans-serif}
.tn{cursor:pointer;transition:opacity .25s}
.tn .box{fill:var(--node);stroke:var(--c);stroke-opacity:.45;stroke-width:1.2;transition:.2s}
.tn .bar{fill:var(--c)}
.tn:hover .box{stroke-opacity:1}
.tn .nm{fill:var(--ink);font-size:13px;font-weight:500}
.tn .nk{fill:var(--c);font-size:11.5px;font-weight:600}
.tn .rg{fill:var(--dim);font-size:12px}
.tn.hit .box,.tn.focus .box{stroke-opacity:1;stroke-width:2;filter:drop-shadow(0 0 7px var(--c))}
.tn.dim,.lk.dim{opacity:.12}
.lk{fill:none;stroke:var(--c);stroke-opacity:.5;stroke-width:1.6;transition:opacity .25s}
.lk.focus{stroke-opacity:1;stroke-width:2.2;filter:drop-shadow(0 0 4px var(--c))}
.hub .box{fill:url(#hubGrad);stroke:none}
.hub text{fill:#04121a;font-family:Kanit;font-weight:600}
.stage-ctl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.stage-ctl button{width:38px;height:38px;border-radius:11px;border:1px solid var(--stroke-2);background:var(--glass-2);color:var(--ink);font:inherit;font-size:18px;cursor:pointer;backdrop-filter:blur(8px)}
.stage-ctl button:hover{border-color:var(--accent);color:var(--accent)}
.hint{position:absolute;left:14px;bottom:12px;font-size:12px;color:var(--muted);background:var(--glass-2);border:1px solid var(--stroke);border-radius:10px;padding:5px 10px;backdrop-filter:blur(8px)}

/* generation view */
.gnav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.gnav .lbl{font-family:Kanit;font-weight:500;font-size:15px;color:var(--ink)}
.gnav .lbl small{font-family:"IBM Plex Sans Thai";font-weight:400;font-size:12.5px;color:var(--muted);margin-left:6px}
.dots{display:flex;gap:8px;align-items:center}
.dots button{width:30px;height:8px;border-radius:999px;border:0;padding:0;cursor:pointer;background:color-mix(in srgb,var(--c) 25%,transparent);transition:.25s}
.dots button.on{background:var(--c);box-shadow:0 0 10px var(--c)}
.arrows{display:flex;gap:8px}
.arrows button{width:42px;height:42px;border-radius:12px;border:1px solid var(--stroke-2);background:var(--glass-2);color:var(--ink);cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(8px);transition:.2s}
.arrows button:hover:not(:disabled){border-color:var(--accent);color:var(--accent);box-shadow:0 0 14px rgba(34,211,238,.3)}
.arrows button:disabled{opacity:.3;cursor:default}
.gens{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;align-items:flex-start;padding-bottom:4px}
.gens::-webkit-scrollbar{display:none}
.gens>.gcol{flex:0 0 calc((100% - 28px) / 3);scroll-snap-align:start;min-width:0}
@media (max-width:900px){.gens>.gcol{flex-basis:calc((100% - 14px) / 2)}}
@media (max-width:600px){.gens>.gcol{flex-basis:100%}}
.gcol{background:var(--glass);border:1px solid var(--stroke);border-radius:18px;padding:14px;backdrop-filter:blur(10px)}
.gcol h3{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 12px;font-family:Kanit;font-weight:500;font-size:18px;color:var(--c)}
.gcol h3 small{font-family:"IBM Plex Sans Thai";font-size:12px;color:var(--muted);font-weight:400}
.gitem{padding:9px 10px;border-radius:12px;border:1px solid transparent;background:rgba(255,255,255,.025);margin-bottom:8px;transition:.2s}
.gitem:hover{border-color:var(--stroke-2)}
.gitem.dim{opacity:.2}
.gmeta{display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--muted);margin-bottom:6px}
.tag{font-family:Kanit;font-size:11px;letter-spacing:.06em;color:var(--accent);border:1px solid rgba(34,211,238,.35);border-radius:999px;padding:0 8px}
.gitem .chip{white-space:normal}

footer{margin-top:26px;text-align:center;color:var(--dim);font-size:12.5px}

.hint .m{display:none}

/* ---------- mobile ---------- */
@media (max-width:600px){
  body{font-size:14px}
  .wrap{padding:18px 12px calc(100px + env(safe-area-inset-bottom))}
  header{gap:12px;margin-bottom:14px}
  header>div:first-child{width:100%}
  h1{font-size:30px}
  .stats{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .stat{min-width:0;padding:8px 6px;text-align:center;border-radius:12px}
  .stat b{font-size:19px}
  .stat span{font-size:11px}

  /* toolbar: search only on top, view switch becomes bottom tab bar */
  .toolbar{top:8px;padding:6px;border-radius:14px;margin-bottom:12px;background:rgba(11,18,34,.92);backdrop-filter:none}
  .search{max-width:none;min-width:0}
  .search input{font-size:16px}
  .legend{display:none}
  .seg{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;gap:6px;padding:6px;border-radius:20px;
    background:rgba(14,21,40,.84);border:1px solid var(--stroke-2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 12px 32px rgba(0,0,0,.5)}
  .seg button{flex:1;flex-direction:column;justify-content:center;gap:3px;padding:8px 4px;font-size:11.5px;border-radius:14px;-webkit-tap-highlight-color:transparent}
  .seg svg{width:20px;height:20px}

  /* branch bar */
  .bbar{padding:6px;border-radius:12px;margin-bottom:12px;background:rgba(11,18,34,.92);backdrop-filter:none}
  .bbar button{padding:6px 10px;font-size:13px}

  /* collapsible branch cards */
  .grid{gap:10px}
  .branch{padding:0;border-radius:16px}
  .branch-no{font-family:"IBM Plex Sans Thai";letter-spacing:0;font-size:12px;gap:10px;margin:0;padding:13px 14px;cursor:pointer;color:var(--muted)}
  .branch-no .bl,.branch-no .bt{display:none}
  .branch-no b{flex:0 0 auto;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;font-family:Kanit;font-size:14px;
    background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.3)}
  .branch-no .bsum{display:block;flex:1;min-width:0;font-size:15px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .branch-no .bcnt{display:block;flex:0 0 auto}
  .branch-no .chev{display:block;flex:0 0 auto;width:18px;height:18px;transition:transform .25s}
  .branch:not(.closed) .chev,.branch.qopen .chev{transform:rotate(180deg)}
  .branch .tree{padding:0 12px 12px}
  .branch.closed:not(.qopen) .tree{display:none}
  .tree ul{padding-left:20px}
  .tree ul>li::before{left:-12px}
  .tree ul>li::after{left:-12px;width:9px}
  .chip{white-space:normal;font-size:13.5px;min-height:32px}

  /* tree overview */
  .stage{height:calc(100dvh - 260px);min-height:380px;border-radius:16px}
  .hint{right:60px;font-size:11.5px}
  .hint .d{display:none} .hint .m{display:inline}

  /* generations */
  .gnav{flex-wrap:wrap}
  .arrows button{width:38px;height:38px}
}
@media print{
  :root{--ink:#1d2433;--muted:#5d6680;--dim:#8a93a8;--stroke:#d8dde8;--stroke-2:#b9c1d3;--glass:#fff;--g1:#b7791f;--g2:#0e7490;--g3:#6d28d9;--g4:#be185d;--accent:#0e7490}
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff;font-size:12px}
  body::before,.toolbar,.stats,.bbar,#v-tree,#v-gen{display:none!important}
  .grid.focusing .branch{opacity:1}
  #v-cards{display:block!important}
  .wrap{padding:0;max-width:none}
  h1{color:#1d2433;background:none}
  .grid{grid-template-columns:1fr 1fr;gap:10px}
  .branch{backdrop-filter:none;break-inside:avoid;padding:10px}
  .branch .tree{display:block!important}
  .chip{background:#fff}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Family Network</div>
      <h1>แผนผังเครือญาติ</h1>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="toolbar">
    <div class="seg" role="tablist">
      <button data-view="tree" title="Tree overview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="2.5"/><circle cx="19" cy="5" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M7.5 12h4M11.5 5v14M11.5 5h5M11.5 19h5"/></svg><span>Tree overview</span></button>
      <button data-view="cards" title="การ์ดแยกสาย">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg><span>แยกสาย</span></button>
      <button data-view="gen" title="ตามรุ่น">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="4" height="16" rx="1.5"/><rect x="10" y="4" width="4" height="16" rx="1.5"/><rect x="17" y="4" width="4" height="16" rx="1.5"/></svg><span>ตามรุ่น</span></button>
    </div>
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--muted)"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="ค้นหาชื่อ หรือชื่อเล่น…" autocomplete="off">
      <span class="count" id="qcount"></span>
    </label>
    <div class="legend">
      <span style="color:var(--g1)"><i style="background:var(--g1)"></i>รุ่น 1</span>
      <span style="color:var(--g2)"><i style="background:var(--g2)"></i>รุ่น 2</span>
      <span style="color:var(--g3)"><i style="background:var(--g3)"></i>รุ่น 3</span>
      <span style="color:var(--g4)"><i style="background:var(--g4)"></i>รุ่น 4</span>    </div>
  </div>

  <section class="view" id="v-tree">
    <div class="stage">
      <svg id="svg">
        <defs>
          <linearGradient id="hubGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
          </linearGradient>
        </defs>
        <g id="vp"></g>
      </svg>
      <div class="stage-ctl">
        <button id="zin" title="ซูมเข้า">+</button>
        <button id="zout" title="ซูมออก">−</button>
        <button id="zfit" title="พอดีจอ">⤢</button>
      </div>
      <div class="hint"><span class="d">ลากเพื่อเลื่อน · สกรอลล์เพื่อซูม · คลิกชื่อเพื่อดูสายตรง</span><span class="m">ลากเลื่อน · ถ่างนิ้วซูม · แตะชื่อดูสายตรง</span></div>
    </div>
  </section>

  <section class="view" id="v-cards"><nav class="bbar" id="bbar"></nav><main class="grid" id="grid"></main></section>
  <section class="view" id="v-gen">
    <div class="gnav">
      <div class="lbl" id="glbl"></div>
      <div class="dots" id="gdots"></div>
      <div class="arrows">
        <button id="gprev" title="รุ่นก่อนหน้า"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
        <button id="gnext" title="รุ่นถัดไป"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
      </div>
    </div>
    <div class="gens" id="gens"></div>
  </section>

  <footer>เรียบเรียงจากตารางแผนผังเครือญาติต้นฉบับ · ⚭ = คู่สมรส</footer>
</div>

<script>
// p: [ [ชื่อ-สกุล, ชื่อเล่น], คู่สมรส... ]   c: ลูก
const families = [
  {p:[["ฉวี สมงาม","หยุน"],["ประยุทธ สมงาม","ยุทธ"]], c:[
    {p:[["พีรพงศ์ สมงาม","บัณฑิต"]], c:[
      {p:[["เพียงพุทธ สมงาม","ภูมิ"]]}
    ]},
    {p:[["พสิษฐ์ตา สมงาม","สุพัตรา"]], c:[
      {p:[["วรางคณา พานิช","เชอรี่"]]},
      {p:[["อัญมาศ พานิช","พีท"]]}
    ]}
  ]},
  {p:[["ปราณี วัฒนประสิทธิ์","หยัน"],["มงคล วัฒนประสิทธิ์","ตี๋"]], c:[
    {p:[["ไพศาล วัฒนประสิทธิ์","ดาม"],["สำราญ วัฒนประสิทธิ์","สำราญ"]], c:[
      {p:[["ศุภิสรา วัฒนประสิทธิ์","ซีอาร์"]]},
      {p:[["ภัทรวรรณ วัฒนประสิทธิ์","ซีดี"]]}
    ]}
  ]},
  {p:[["ปัญญา แซ่อึ้ง","กู้"],["นิตยา มามั่งคั่ง","นิด"]], c:[
    {p:[["คึกเดช วงศ์เสถียรไท","ช้าง"],["สุดารัตน์ แท่นจินดารัตน์","น้องรัตน์"]], c:[
      {p:[["คชารัตน์ วงศ์เสถียรไท","คชา"]]}
    ]}
  ]},
  {p:[["สมบูรณ์ โทอ่อน","โอ่ง"],["ชูศิลป์ โทอ่อน","สิน"]], c:[
    {p:[["สมเกียรติ โทอ่อน","เกียรติ"],["แสงดาว โทอ่อน","ดาว"]], c:[
      {p:[["ศิรกัญญา โทอ่อน","สดใส"]]}
    ]},
    {p:[["ศราวุธ โทอ่อน","มดเอ็กซ์"]], c:[
      {p:[["กุลนันท์ โทอ่อน","ใบเตย"],["กฤษฎา ขวัญเสน","เอ้"]], c:[
        {p:[["ธาวิน ขวัญเสน","ธาวิน"]]}
      ]},
      {p:[["ธีรภัทธ์ โทอ่อน","พริ้นเตอร์"]]}
    ]},
    {p:[["ศิริภรณ์ จุลฬา","น้องหญิง"],["พิเชษฐ์ จุลฬา","เอ้"]]}
  ]},
  {p:[["สมศักดิ์ แซ่อึ้ง","ออด"],["ธันยพร อ้นชู","นงค์"]], c:[
    {p:[["นิจณดา กาบคำ","นุ่น"]], c:[
      {p:[["ศุภธาดา กาบคำ","โอชิ"],["ญาณีสา ภูมิอ่อน","แบม"]], c:[
        {p:[["อัณณ์ชญา กาบคำ","เอญ่า"]]}
      ]},
      {p:[["นิธิวรรธ สนธิ์น้อย","อั่งเปา"]]}
    ]}
  ]},
  {p:[["วิรัลยุพา ลาภวุฒิไกร","ยุพา"],["ชาญณรงค์ ลาภวุฒิไกร","จุก"]], c:[
    {p:[["สุมารจ ลาภวุฒิไกร","เกศ"],["สมเกียรติ นิรแก้ว","น้ำพุ"]], c:[
      {p:[["สิรภัทร ลาภวุฒิไกร","เนื้อทอง"]]},
      {p:[["สิริกัญญา ลาภวุฒิไกร","สร้อยทอง"]]}
    ]},
    {p:[["อธิวัฒน์ ลาภวุฒิไกร","อะ"]]},
    {p:[["ปฏิภาณ ลาภวุฒิไกร","มะ"],["สุกัญญา ฤทธิเดช","รส"]], c:[
      {p:[["ธนมล ลาภวุฒิไกร","ปิ่นทอง"]]},

    ]}
  ]},
  {p:[["ทัศนีย์ เขียวทอง","ปะเล็ก"],["ชำนาญ เขียวทอง","จ่อย"]], c:[
    {p:[["สุพจน์ เขียวทอง","ปอ"]]},
    {p:[["ทัศวรรณ เขียวทอง","ปู"]]}
  ]},
  {p:[["ทนงศักดิ์ แซ่อึ้ง","ป๊อก"],["สุภาพร แซ่อึ้ง","หมวยเล็ก"]]},
  {p:[["เสกสรร แซ่อึ้ง","เสก"],["ประมวล สำราญพันธ์","มวล"]], c:[
    {p:[["ทิพย์วารี แซ่อึ้ง","เกมส์"],["สุรเชษฐ์ วงศ์สกุลเดช","เชษฐ์"]], c:[
      {p:[["ธันนลิน วงศ์สกุลเดช","จินหมิง"]]}
    ]},
    {p:[["ปฐวี แซ่อึ้ง","ทีม"]]}
  ]},
  {p:[["บุญช่วย แซ่อึ้ง","ช่วย"],["อมร ทองสะอาด","อมร"]]}
];

/* ---------- prep ---------- */
const nodes = [];
(function prep(list, gen, branch, parent){
  list.forEach((n, i) => {
    n.id = nodes.length; n.gen = gen; n.branch = branch ?? i + 1; n.parent = parent;
    nodes.push(n);
    if (n.c) prep(n.c, gen + 1, n.branch, n);
  });
})(families, 1, null, null);

const esc = s => s.replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const chip = ([name, nick]) =>
  `<span class="chip" data-q="${esc((name + " " + nick).toLowerCase())}"><b>${esc(name)}</b>${nick ? `<span class="nick">${esc(nick)}</span>` : ""}</span>`;
const unitHTML = n => n.p.map(chip).join('<span class="ring">⚭</span>');
const nickOf = n => n.p.map(([nm, nk]) => nk || nm.split(" ")[0]).join(" & ");

/* ---------- stats ---------- */
const people = nodes.reduce((s, n) => s + n.p.length, 0);
const maxGen = Math.max(...nodes.map(n => n.gen));
document.getElementById("stats").innerHTML = [
  [people, "คน"], [families.length, "สายครอบครัว"], [maxGen, "รุ่น"], [nodes.filter(n => n.p.length > 1).length, "คู่สมรส"]
].map(([v, l]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");

/* ---------- cards view ---------- */
function li(n){
  const kids = n.c && n.c.length ? `<ul>${n.c.map(li).join("")}</ul>` : "";
  return `<li class="g${n.gen}"><div class="unit">${unitHTML(n)}</div>${kids}</li>`;
}
const countP = n => n.p.length + (n.c || []).reduce((s, c) => s + countP(c), 0);
document.getElementById("grid").innerHTML = families.map((f, i) =>
  `<section class="branch closed" id="branch-${i + 1}"><button type="button" class="branch-no" aria-expanded="false"><span class="bl">BRANCH </span><b>${String(i + 1).padStart(2, "0")}</b><span class="bt"> · สายที่ ${i + 1}</span><span class="bsum">${esc(nickOf(f))}</span><span class="bcnt">${countP(f)} คน</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button><ul class="tree">${li(f)}</ul></section>`
).join("");
const setOpen = (s, open) => { s.classList.toggle("closed", !open); s.querySelector(".branch-no").setAttribute("aria-expanded", open); };
document.getElementById("grid").addEventListener("click", e => {
  const h = e.target.closest(".branch-no"); if (h) setOpen(h.parentElement, h.parentElement.classList.contains("closed"));
});

/* branch focus bar */
const grid = document.getElementById("grid"), bbar = document.getElementById("bbar"), toolbar = document.querySelector(".toolbar");
bbar.innerHTML = `<button data-b="0" class="on">ทั้งหมด</button>` + families.map((f, i) =>
  `<button data-b="${i + 1}" title="${esc(f.p.map(p => p[0] + (p[1] ? " (" + p[1] + ")" : "")).join(" ⚭ "))}"><b>${String(i + 1).padStart(2, "0")}</b>${esc(f.p.map(p => p[0].split(" ")[0]).join(" & "))}</button>`
).join("");
let focusedBranch = 0;
function focusBranch(b){
  focusedBranch = b;
  [...bbar.children].forEach(btn => btn.classList.toggle("on", +btn.dataset.b === b));
  grid.classList.toggle("focusing", b > 0);
  grid.querySelectorAll(".branch").forEach(s => s.classList.toggle("focus", s.id === "branch-" + b));
  if (b > 0) setOpen(document.getElementById("branch-" + b), true);
  if (b > 0) document.getElementById("branch-" + b).scrollIntoView({behavior: "smooth", block: "start"});
  else window.scrollTo({top: 0, behavior: "smooth"});
  bbar.querySelector(".on")?.scrollIntoView({behavior: "smooth", inline: "nearest", block: "nearest"});
}
bbar.onclick = e => { const btn = e.target.closest("button"); if (!btn) return; const b = +btn.dataset.b; focusBranch(b === focusedBranch ? 0 : b); };
document.addEventListener("keydown", e => { if (e.key === "Escape" && current === "cards" && focusedBranch) focusBranch(0); });
function placeBbar(){
  const top = toolbar.offsetHeight + 18;
  bbar.style.top = top + "px";
  document.documentElement.style.setProperty("--bbar-off", (top + bbar.offsetHeight + 14) + "px");
}
window.addEventListener("resize", placeBbar);

/* ---------- generation view ---------- */
document.getElementById("gens").innerHTML = Array.from({length: maxGen}, (_, i) => i + 1).map(g => {
  const list = nodes.filter(n => n.gen === g);
  const cnt = list.reduce((s, n) => s + n.p.length, 0);
  return `<div class="gcol g${g}"><h3>รุ่นที่ ${g}<small>${cnt} คน</small></h3>${
    list.map(n => `<div class="gitem g${g}" data-node="${n.id}"><div class="gmeta"><span class="tag">สาย ${n.branch}</span>${
      n.parent ? `<span>ลูกของ ${esc(nickOf(n.parent))}</span>` : ""}</div><div class="unit">${unitHTML(n)}</div></div>`).join("")
  }</div>`;
}).join("");

/* generation carousel */
const gens = document.getElementById("gens"), gprev = document.getElementById("gprev"), gnext = document.getElementById("gnext");
const glbl = document.getElementById("glbl"), gdots = document.getElementById("gdots");
const GCOUNT = gens.children.length;
gdots.innerHTML = Array.from({length: GCOUNT}, (_, i) => `<button class="g${i + 1}" title="รุ่นที่ ${i + 1}" data-i="${i}"></button>`).join("");
const gstep = () => (gens.children[0]?.getBoundingClientRect().width || 1) + 14;
function gupdate(){
  if (!gens.clientWidth) return;
  const s = gstep();
  const first = Math.round(gens.scrollLeft / s);
  const vis = Math.max(1, Math.round((gens.clientWidth + 14) / s));
  const last = Math.min(GCOUNT, first + vis);
  glbl.innerHTML = `รุ่นที่ ${first + 1}${last > first + 1 ? "–" + last : ""}<small>จากทั้งหมด ${GCOUNT} รุ่น</small>`;
  gprev.disabled = gens.scrollLeft <= 2;
  gnext.disabled = gens.scrollLeft + gens.clientWidth >= gens.scrollWidth - 2;
  [...gdots.children].forEach((d, i) => d.classList.toggle("on", i >= first && i < last));
}
gprev.onclick = () => gens.scrollBy({left: -gstep()});
gnext.onclick = () => gens.scrollBy({left: gstep()});
gdots.onclick = e => { const b = e.target.closest("button"); if (b) gens.scrollTo({left: gstep() * +b.dataset.i}); };
gens.addEventListener("scroll", gupdate, {passive: true});
window.addEventListener("resize", gupdate);
document.addEventListener("keydown", e => {
  if (current !== "gen" || e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight") gnext.click();
  if (e.key === "ArrowLeft") gprev.click();
});

/* ---------- tree overview ---------- */
const svg = document.getElementById("svg"), vp = document.getElementById("vp");
const NS = "http://www.w3.org/2000/svg";
const hub = {id: "hub", gen: 0, hub: true, c: families, w: 150, h: 64};
let treeW = 0, treeH = 0, fitted = false;
let k = 1, tx = 0, ty = 0;

function buildTree(){
  const cv = document.createElement("canvas").getContext("2d");
  const tw = (t, f) => (cv.font = f, cv.measureText(t).width);
  const FN = '500 13px "IBM Plex Sans Thai"', FK = '600 11.5px "IBM Plex Sans Thai"';
  const LH = 22, PAD = 14;
  nodes.forEach(n => {
    n.lines = n.p.map(([nm, nk], i) => ({nm, nk, ring: i > 0}));
    n.w = Math.ceil(Math.max(...n.lines.map(l => (l.ring ? 16 : 0) + tw(l.nm, FN) + (l.nk ? tw(l.nk, FK) + 12 : 0)))) + PAD * 2 + 4;
    n.h = n.lines.length * LH + 14;
  });

  // columns
  const colW = [hub.w];
  nodes.forEach(n => colW[n.gen] = Math.max(colW[n.gen] || 0, n.w));
  const colX = [0]; for (let d = 1; d < colW.length; d++) colX[d] = colX[d - 1] + colW[d - 1] + 72;
  hub.x = 0; nodes.forEach(n => n.x = colX[n.gen]);

  // vertical tidy layout
  const GAP = 10, BGAP = 26; let cur = 0;
  const shift = (n, d) => { n.cy += d; (n.c || []).forEach(c => shift(c, d)); };
  (function lay(n){
    const start = cur;
    if (!n.c || !n.c.length){ n.cy = cur + n.h / 2; cur += n.h + GAP; return; }
    n.c.forEach((c, i) => { if (n.hub && i) cur += BGAP; lay(c); });
    n.cy = (n.c[0].cy + n.c[n.c.length - 1].cy) / 2;
    if (n.cy - n.h / 2 < start){ const d = start - (n.cy - n.h / 2); shift(n, d); cur += d; }
    cur = Math.max(cur, n.cy + n.h / 2 + GAP);
  })(hub);
  treeW = colX[colX.length - 1] + colW[colW.length - 1]; treeH = cur;

  // draw
  let links = "", boxes = "";
  const all = [hub, ...nodes];
  all.forEach(p => (p.c || []).forEach(c => {
    const x1 = p.x + p.w, y1 = p.cy, x2 = c.x, y2 = c.cy, mx = (x1 + x2) / 2;
    links += `<path class="lk g${c.gen}" data-node="${c.id}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`;
  }));
  boxes += `<g class="tn hub" transform="translate(0,${hub.cy - hub.h / 2})"><rect class="box" width="${hub.w}" height="${hub.h}" rx="32"/>
    <text x="${hub.w / 2}" y="28" text-anchor="middle" font-size="16">เครือญาติ</text>
    <text x="${hub.w / 2}" y="47" text-anchor="middle" font-size="12" font-weight="500">${families.length} สาย · ${people} คน</text></g>`;
  nodes.forEach(n => {
    let t = "";
    n.lines.forEach((l, i) => {
      const y = 7 + i * LH + 16; let x = PAD + 4;
      if (l.ring){ t += `<text class="rg" x="${x}" y="${y}">⚭</text>`; x += 16; }
      t += `<text x="${x}" y="${y}"><tspan class="nm">${esc(l.nm)}</tspan>${l.nk ? `<tspan class="nk" dx="12">${esc(l.nk)}</tspan>` : ""}</text>`;
    });
    boxes += `<g class="tn g${n.gen}" data-node="${n.id}" transform="translate(${n.x},${n.cy - n.h / 2})">
      <rect class="box" width="${n.w}" height="${n.h}" rx="10"/><rect class="bar" x="0" y="8" width="3" height="${n.h - 16}" rx="1.5"/>${t}</g>`;
  });
  vp.innerHTML = links + boxes;
}

const apply = () => vp.setAttribute("transform", `translate(${tx},${ty}) scale(${k})`);
const clampK = v => Math.min(3, Math.max(0.15, v));
function fit(){
  const r = svg.getBoundingClientRect(); if (!r.width) return;
  k = clampK(Math.min((r.width - 40) / treeW, (r.height - 40) / treeH));
  tx = (r.width - treeW * k) / 2; ty = (r.height - treeH * k) / 2; apply(); fitted = true;
}
function zoomAt(f, mx, my){ const nk = clampK(k * f); tx = mx - (mx - tx) * nk / k; ty = my - (my - ty) * nk / k; k = nk; apply(); }
function centerOn(n){
  const r = svg.getBoundingClientRect(); k = Math.max(k, 1);
  tx = r.width / 2 - (n.x + n.w / 2) * k; ty = r.height / 2 - n.cy * k; apply();
}
svg.addEventListener("wheel", e => { e.preventDefault(); const r = svg.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top); }, {passive: false});
// drag to pan (mouse + 1 finger), pinch to zoom (2 fingers)
const ptrs = new Map(); let drag = null, pinch = 0;
svg.addEventListener("pointerdown", e => {
  ptrs.set(e.pointerId, {x: e.clientX, y: e.clientY}); svg.setPointerCapture(e.pointerId);
  if (ptrs.size === 1){ drag = {x: e.clientX, y: e.clientY, moved: 0, target: e.target}; svg.classList.add("drag"); }
  else { pinch = 0; if (drag) drag.moved = 99; }
});
svg.addEventListener("pointermove", e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (ptrs.size >= 2){
    const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y), r = svg.getBoundingClientRect();
    if (pinch) zoomAt(d / pinch, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top);
    pinch = d; return;
  }
  if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.moved += Math.abs(dx) + Math.abs(dy); drag.x = e.clientX; drag.y = e.clientY; tx += dx; ty += dy; apply();
});
const pend = e => {
  ptrs.delete(e.pointerId);
  if (ptrs.size === 1){ const [p] = ptrs.values(); drag = {x: p.x, y: p.y, moved: 99, target: null}; pinch = 0; return; }
  if (ptrs.size) return;
  if (e.type === "pointerup" && drag && drag.moved < 8){
    const g = drag.target.closest && drag.target.closest(".tn[data-node]");
    g ? focusLineage(nodes[+g.dataset.node]) : clearTree();
  }
  drag = null; pinch = 0; svg.classList.remove("drag");
};
svg.addEventListener("pointerup", pend);
svg.addEventListener("pointercancel", pend);
const midZoom = f => { const r = svg.getBoundingClientRect(); zoomAt(f, r.width / 2, r.height / 2); };
document.getElementById("zin").onclick = () => midZoom(1.25);
document.getElementById("zout").onclick = () => midZoom(0.8);
document.getElementById("zfit").onclick = fit;

function clearTree(){ vp.querySelectorAll(".dim,.focus,.hit").forEach(el => el.classList.remove("dim", "focus", "hit")); }
function focusLineage(n){
  qInput.value = ""; runSearch();
  const set = new Set([n.id]);
  for (let p = n.parent; p; p = p.parent) set.add(p.id);
  (function down(x){ (x.c || []).forEach(c => { set.add(c.id); down(c); }); })(n);
  vp.querySelectorAll(".tn[data-node],.lk").forEach(el => {
    const on = set.has(+el.dataset.node);
    el.classList.toggle("dim", !on); el.classList.toggle("focus", on);
  });
}

/* ---------- search (all views) ---------- */
const qInput = document.getElementById("q"), qCount = document.getElementById("qcount");
function runSearch(){
  const q = qInput.value.trim().toLowerCase();
  const hit = n => q && n.p.some(([nm, nk]) => (nm + " " + nk).toLowerCase().includes(q));
  const hits = q ? nodes.filter(hit) : [];
  const ids = new Set(hits.map(n => n.id));
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("hit", !!q && c.dataset.q.includes(q)));
  document.querySelectorAll(".branch").forEach((b, i) => {
    const has = hits.some(n => n.branch === i + 1);
    b.classList.toggle("dim", !!q && !has); b.classList.toggle("qopen", has);
  });
  document.querySelectorAll(".gitem").forEach(el => el.classList.toggle("dim", !!q && !ids.has(+el.dataset.node)));
  vp.querySelectorAll(".focus").forEach(el => el.classList.remove("focus"));
  vp.querySelectorAll(".tn[data-node]").forEach(el => { const on = ids.has(+el.dataset.node); el.classList.toggle("hit", on); el.classList.toggle("dim", !!q && !on); });
  vp.querySelectorAll(".lk").forEach(el => el.classList.toggle("dim", !!q));
  qCount.textContent = q ? `พบ ${hits.reduce((s, n) => s + n.p.filter(([nm, nk]) => (nm + " " + nk).toLowerCase().includes(q)).length, 0)}` : "";
  if (hits.length && current === "tree") centerOn(hits[0]);
}
qInput.addEventListener("input", runSearch);

/* ---------- view switching ---------- */
let current = "tree";
function show(v){
  current = v;
  document.querySelectorAll(".seg button").forEach(b => b.classList.toggle("on", b.dataset.view === v));
  document.querySelectorAll(".view").forEach(s => s.classList.toggle("on", s.id === "v-" + v));
  try { localStorage.setItem("famtree-view", v); } catch (e) {}
  if (v === "tree" && !fitted) requestAnimationFrame(fit);
  if (v === "gen") requestAnimationFrame(gupdate);
  if (v === "cards") requestAnimationFrame(placeBbar);
}
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => show(b.dataset.view));
let saved = location.hash.slice(1) || null; if (!saved) try { saved = localStorage.getItem("famtree-view"); } catch (e) {}

buildTree();
show(["tree", "cards", "gen"].includes(saved) ? saved : "cards");
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { buildTree(); fitted = false; if (current === "tree") fit(); runSearch(); });
window.addEventListener("resize", () => { if (current === "tree") fit(); });
</script>
